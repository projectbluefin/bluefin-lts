repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
        - id: check-json
          exclude: \.devcontainer\.json
        - id: check-toml
        - id: check-yaml
        - id: end-of-file-fixer
        - id: trailing-whitespace
        - id: check-merge-conflict
        - id: detect-private-key
        - id: check-added-large-files
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: no-floating-action-tags
        name: Block floating GitHub Action tags (@main, @v*)
        language: pygrep
        entry: 'uses:\s+(?!projectbluefin/(actions|bonedigger|testsuite)/).*@(main|master|latest|v[0-9]+(\.[0-9]+)*)\b'
        types: [yaml]
        files: '^\.github/workflows/'
      - id: no-sha-pins-for-internal-actions
        name: Block SHA pins for projectbluefin/actions and projectbluefin/testsuite refs (use @v1)
        language: pygrep
        entry: 'uses:.*projectbluefin/(actions|testsuite).*@[0-9a-f]{40}'
        types: [yaml]
        files: '(^\.github/workflows/.*\.yml$|action\.yml$)'
  - repo: local
    hooks:
      # The factory's own gate, run at commit time rather than only in CI so a
      # broken recipe set is caught before it reaches a pull request. This is
      # the fast check only -- it builds nothing.
      - id: factory-validate
        name: Validate the GNOME package factory
        language: system
        entry: python3 factory/tools/validate.py
        pass_filenames: false
        files: ^(factory/(packages|config|tools)/|\.packit\.yaml)
      - id: factory-packit-config-current
        name: .packit.yaml matches the recipe inventory
        language: system
        entry: python3 factory/tools/render_packit_config.py --check
        pass_filenames: false
        files: ^(factory/packages/|\.packit\.yaml)
