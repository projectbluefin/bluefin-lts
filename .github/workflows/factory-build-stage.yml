# Build one wave of packages.
#
# Exists as a reusable workflow because the wave itself is the unit of build
# parallelism: everything in wave N can build at once, and everything in wave
# N+1 can resolve its BuildRequires against what wave N produced.
#
# This job knows nothing about the other waves beyond the artifacts they left
# behind. All ordering lives in the caller.
name: Factory build stage

on:
  workflow_call:
    inputs:
      stage:
        description: Wave number, used in artifact names.
        required: true
        type: string
      seed_image:
        description: Immutable previously published repository image.
        required: false
        type: string
      packages:
        description: JSON array of package names to build.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      # One package failing must not stop its neighbours. A wave is a batch
      # of independent builds, and cancelling the rest of it on the first
      # failure would waste the whole wave over one recipe.
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Loaded from the artifact prepare produced, not pulled from a registry.
      # See the comment in factory-build.yml: this is what makes every job in
      # the run provably use the same build root bytes.
      - name: Load the build root
        uses: ./.github/actions/factory-load-buildroot

      - name: Fetch and verify the package source
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          python3 factory/tools/source_pipeline.py stage "$PACKAGE"
          python3 factory/tools/source_pipeline.py verify-staged --package "$PACKAGE"

      - name: Assemble the seed and strictly earlier waves
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          SEED_IMAGE: ${{ inputs.seed_image }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p work/prior work/newrpms work/dl
          if [ -n "$SEED_IMAGE" ]; then
            docker pull "$SEED_IMAGE"
            docker create --name factory-seed "$SEED_IMAGE" /unused
            docker cp factory-seed:/factory/. work/prior/
            docker rm factory-seed
          fi
          # Adapted from utah-packages: never admit same-wave siblings,
          # regardless of which parallel job finishes first.
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' > work/artifacts.txt
          while read -r artifact; do
            if [[ "$artifact" =~ ^factory-rpm-s([0-9]+)- ]] && \
                [ "${BASH_REMATCH[1]}" -lt "$STAGE" ]; then
              gh run download "$RUN_ID" --repo "$REPOSITORY" \
                --name "$artifact" --dir "work/dl/$artifact"
              find "work/dl/$artifact" -name '*.rpm' -exec cp {} work/newrpms/ \;
            fi
          done < work/artifacts.txt
          packages=$(python3 factory/tools/packit_workflow.py packages)
          python3 factory/tools/assemble_repo.py --seed work/prior --built work/newrpms \
            --build-list "$packages" --report work/prior-built.json

      - name: Build the package with its dependencies in one container
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "work/rpms/$PACKAGE"
          security_args=()
          if [ "$PACKAGE" = umockdev ]; then
            security_args=(--security-opt "seccomp=$PWD/factory/packages/umockdev/umockdev-seccomp.json")
          fi
          docker run --rm --pull=never "${security_args[@]}" -e PACKAGE \
            -v "$PWD:/repo:Z" -v "$PWD/work/prior:/prior:Z" \
            factory-buildroot:run bash /repo/factory/tools/build_package.sh

          count=$(find "work/rpms/$PACKAGE" -name '*.rpm' | wc -l)
          # A build that produced nothing must fail here rather than at the
          # upload step, where a missing file can pass quietly.
          if [ "$count" -eq 0 ]; then
            echo "::error title=no RPMs produced::$PACKAGE"
            exit 1
          fi
          echo "built $count RPM(s) for $PACKAGE"

      - name: Record what this package produced
        if: always()
        run: |
          set -euo pipefail
          {
            echo "package: ${{ matrix.package }}"
            echo "stage: ${{ inputs.stage }}"
            echo "built: $(find 'work/rpms/${{ matrix.package }}' -name '*.rpm' 2>/dev/null | wc -l)"
            echo "---"
            find "work/rpms/${{ matrix.package }}" -name '*.rpm' -printf '%f\n' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-rpm-s${{ inputs.stage }}-${{ matrix.package }}
          path: work/rpms/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7
