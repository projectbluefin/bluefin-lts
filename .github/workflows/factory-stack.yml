        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          python3 factory/tools/build_stack.py --plan work/graph/plan.json --check
          docker run --rm --pull=never -v "$PWD:/repo:ro" -v "$PWD/work/prior:/factory" \
            factory-buildroot:run bash -c \
            'set -e; dnf -y install createrepo_c; createrepo_c /factory; bash /repo/factory/tools/consumer_transaction.sh' \
