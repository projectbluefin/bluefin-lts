# Full-stack binary verification, with no registry publication or signing.
name: Factory GNOME stack
on:
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-stack-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate recipes and load the pinned CentOS root
        run: |
          set -euo pipefail
          python3 factory/tools/validate.py
          python3 factory/tools/render_packit_config.py --check
          python3 factory/tools/buildroot.py --output work/buildroot-resolved.json \
            --snapshot work/buildroot-provenance.json
          docker tag "$(python3 factory/tools/buildroot.py --digest-only)" factory-buildroot:run
      - name: Extract exact dependencies and solve the GNOME stack
        id: plan
        run: |
          set -euo pipefail
          python3 factory/tools/extract_buildrequires.py --image factory-buildroot:run --output work/graph
          python3 factory/tools/build_graph.py plan --rows work/graph/rows \
            --stack --output work/graph/plan.json
          test "$(python3 -c 'import json; print(len(json.load(open("work/graph/plan.json"))["waves"]))')" -le 16
      - name: Check GNOME dependency tree before compilation
        id: preflight
        run: |
          set -euo pipefail
          python3 factory/tools/dependency_preflight.py --rows work/graph/rows \
            --plan work/graph/plan.json --output work/graph/dependency-preflight.json
          # Exercise Glycin's namespace setup with its actual recipe profile
          # before spending time on any stack compilation.
          docker run --rm --pull=never \
            --security-opt "seccomp=$PWD/factory/packages/glycin/glycin-seccomp.json" \
            factory-buildroot:run bash -c \
            'set -e; dnf -y install bubblewrap; bwrap --unshare-all --die-with-parent --chdir / \
              --ro-bind /usr /usr --dev /dev --ro-bind-try /etc/ld.so.cache /etc/ld.so.cache \
              --tmpfs /tmp-home --tmpfs /tmp-run --clearenv \
              --setenv HOME /tmp-home --setenv XDG_RUNTIME_DIR /tmp-run \
              --symlink /usr/lib64 /lib64 --symlink /usr/lib /lib /usr/bin/true'
      - name: Build wave 0
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: python3 factory/tools/build_stack.py --plan work/graph/plan.json --wave 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        with:
          name: factory-stack-wave0
          path: |
            work/stack-logs
            work/stack-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Build wave 1
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: python3 factory/tools/build_stack.py --plan work/graph/plan.json --wave 1
