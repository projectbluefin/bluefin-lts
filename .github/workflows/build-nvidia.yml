name: Build Bluefin Nvidia

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

on:
  pull_request:
    branches:
      - testing
    paths:
      - Containerfile
      - Justfile
      - build_scripts/**
      - system_files/**
      - system_files_overrides/**
      - image-versions.yaml
  push:
    branches:
      - testing
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - '**.md'
      - 'AGENTS.md'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: projectbluefin/actions/bootc-build/detect-changes@v1
        id: detect
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build_scripts/**'
              - 'system_files/**'
              - 'system_files_overrides/**'
              - 'image-versions.yaml'
              - 'Justfile'
            nvidia:
              - 'Containerfile'

  build:
    name: Build bluefin-lts-nvidia image
    needs: [detect-changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.should_build == 'true')
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    secrets: inherit
    with:
      brand_name: bluefin-lts-nvidia
      stream_name: testing
      image_flavors: '["main"]'
      architecture: '["x86_64"]'
      # NVIDIA aarch64 is built independently in build-nvidia-aarch64.yml, so
      # this workflow must not wait for an optional/less-reliable ARM build.
      # It must also never publish :testing directly: that raced against
      # build-nvidia-aarch64.yml's own publish and could leave :testing
      # resolving to whichever architecture published last (issue #421).
      # build-nvidia-manifest.yml is the only place :testing is written; it
      # assembles both architectures' digests into a signed multi-arch index
      # once available, without blocking this build on ARM.
      publish_stream_tag: 'false'
