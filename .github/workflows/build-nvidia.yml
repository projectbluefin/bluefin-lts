name: Build Bluefin Nvidia

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

on:
  pull_request:
    branches:
      - testing
    paths:
      - Containerfile
      - Justfile
      - build_scripts/**
      - system_files/**
      - system_files_overrides/**
      - image-versions.yaml
  push:
    branches:
      - testing
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - '**.md'
      - 'AGENTS.md'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: projectbluefin/actions/bootc-build/detect-changes@v1
        id: detect
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build_scripts/**'
              - 'system_files/**'
              - 'system_files_overrides/**'
              - 'image-versions.yaml'
              - 'Justfile'
            nvidia:
              - 'Containerfile'

  build:
    name: Build bluefin-lts-nvidia image
    needs: [detect-changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.should_build == 'true')
    uses: projectbluefin/actions/.github/workflows/reusable-build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      issues: write
    secrets: inherit
    with:
      brand_name: bluefin-lts-nvidia
      stream_name: testing
      image_flavors: '["main"]'
      architecture: '["x86_64", "aarch64"]'
      publish_stream_tag: 'false'

  manifest:
    name: Create and sign multi-arch manifest
    needs: [build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Create multi-arch manifest
        id: create-manifest
        uses: projectbluefin/actions/bootc-build/create-manifest@v1
        with:
          image-name: bluefin-lts-nvidia
          digests-json: ${{ toJson(fromJson(needs.build.outputs.digests)['bluefin-lts-nvidia']) }}
          tags: testing
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign, generate SBOM, and attest
        uses: projectbluefin/actions/bootc-build/sign-and-publish@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/bluefin-lts-nvidia
          digest: ${{ steps.create-manifest.outputs.digest }}
          signing-mode: keyless
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: bluefin-lts-nvidia
          certificate-identity-regexp: >-
            ^https://github\.com/projectbluefin/(bluefin-lts|actions)/\.github/workflows/
