name: Promote testing to main

# Opens and maintains a squash promotion PR from testing → main.
# Auto-merges via enablePullRequestAutoMerge (--auto) — no human approval required.
# main branch protection requires 0 reviews; gate checks are the only gate.
#
# Factory-standard branch model: source_branch=testing, target_branch=main.
# Compares testing vs main trees and opens auto/promote-testing-to-main → main
# when they differ. On merge, execute-release.yml fires and publishes :stable.
#
# Triggers:
#   - push to testing (immediate re-evaluation after every merge)
#   - daily 04:00 UTC — matches bluefin cadence

on:
  workflow_run:
    workflows: ["Post-Testing E2E"]
    types: [completed]
    branches: [testing]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin-lts"},{"image":"bluefin-lts-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin-lts|actions)/\.github/workflows/
      source_branch: testing
      target_branch: main
      run_e2e: true
      e2e_image: ghcr.io/projectbluefin/bluefin-lts:testing
      # main uses a merge queue ruleset (17070416): gh pr merge --auto is blocked.
      # use_merge_queue: true calls enqueuePullRequest GraphQL instead, which
      # places the PR in the queue and lets it squash-merge once checks pass.
      use_merge_queue: true
    secrets: inherit

  # The release gate in reusable-promote-squash.yml requires a successful
  # Post-Testing E2E run recorded on the testing branch head SHA, but that
  # run is only dispatched by build-regular.yml after a successful testing
  # image build — pushes to testing that skip the build (docs/CI changes) or
  # a failed dispatch condition leave the head SHA without a run, and the
  # gate then fails on every evaluation until the next image build. Backfill
  # the missing run here after each gate evaluation (even a failed one); its
  # completion re-triggers this workflow via workflow_run, and the gate then
  # finds it and promotes.
  dispatch-missing-e2e:
    name: Backfill e2e for testing head
    needs: [promote]
    if: always() && needs.promote.result != 'skipped' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch Post-Testing E2E on testing head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          testing_head="$(gh api "repos/$REPO/branches/testing" --jq '.commit.sha')"

          # Skip if a completed successful e2e run already exists for this head.
          existing="$(gh run list --repo "$REPO" --workflow post-testing-e2e.yml \
            --branch testing --status success \
            --json headSha --jq "[.[] | select(.headSha == \"$testing_head\")] | length")"
          if [[ "$existing" != "0" ]]; then
            echo "Successful e2e run already recorded for $testing_head; skipping dispatch."
            exit 0
          fi

          gh workflow run post-testing-e2e.yml \
            --repo "$REPO" \
            --ref testing \
            -f image="ghcr.io/projectbluefin/bluefin-lts:testing" \
            -f suites="smoke"
          echo "Dispatched post-testing-e2e against testing ($testing_head)."
