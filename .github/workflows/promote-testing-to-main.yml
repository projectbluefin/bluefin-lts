name: Promote testing to main

# Opens and maintains a squash promotion PR from testing → main.
# Auto-merges via enablePullRequestAutoMerge (--auto) — no human approval required.
# main branch protection requires 0 reviews; gate checks are the only gate.
#
# Factory-standard branch model: source_branch=testing, target_branch=main.
# Compares testing vs main trees and opens auto/promote-testing-to-main → main
# when they differ. On merge, execute-release.yml fires and publishes :stable.
#
# Triggers:
#   - push to testing (immediate re-evaluation after every merge)
#   - completion of Post-Testing E2E / Post-Testing E2E (nvidia) on testing
#     (re-evaluation once a backfilled run lands)
#   - daily 04:00 UTC — matches bluefin cadence

on:
  workflow_run:
    workflows: ["Post-Testing E2E", "Post-Testing E2E (nvidia)"]
    types: [completed]
    branches: [testing]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: promote-testing-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: read
  statuses: write

jobs:
  wait-nvidia-e2e:
    name: Wait for NVIDIA E2E
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for NVIDIA Post-Testing E2E to complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          testing_head="$(gh api "repos/$REPO/branches/testing" --jq '.commit.sha')"
          echo "Testing HEAD: ${testing_head}"

          # Poll for a successful NVIDIA E2E run on this SHA.
          for i in $(seq 1 30); do
            nvidia_run="$(gh run list --repo "$REPO" --workflow post-testing-e2e-nvidia.yml \
              --branch testing --status success \
              --json headSha \
              --jq "[.[] | select(.headSha == \"${testing_head}\")] | length")"
            if [[ "${nvidia_run}" -gt 0 ]]; then
              echo "NVIDIA E2E passed for ${testing_head}."
              exit 0
            fi
            echo "NVIDIA E2E not yet complete for ${testing_head} (attempt ${i}/30) — waiting 30s..."
            sleep 30
          done

          echo "::error::NVIDIA E2E did not complete successfully for ${testing_head} within timeout"
          exit 1

  promote:
    needs: [wait-nvidia-e2e]
    if: always() && needs.wait-nvidia-e2e.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@v1
    with:
      variants: >-
        [{"image":"bluefin-lts"},{"image":"bluefin-lts-nvidia"}]
      cosign_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin-lts|actions)/\.github/workflows/
      source_branch: testing
      target_branch: main
      run_e2e: true
      e2e_image: ghcr.io/projectbluefin/bluefin-lts:testing
      # main uses a merge queue ruleset (17070416): gh pr merge --auto is blocked.
      # use_merge_queue: true calls enqueuePullRequest GraphQL instead, which
      # places the PR in the queue and lets it squash-merge once checks pass.
      use_merge_queue: true
    secrets: inherit

  # The release gate in reusable-promote-squash.yml requires a successful
  # Post-Testing E2E run recorded on the testing branch head SHA, and the
  # NVIDIA gate above requires the same for post-testing-e2e-nvidia.yml,
  # but those runs are only dispatched by build-regular.yml /
  # build-nvidia-manifest.yml after a successful image build — pushes to
  # testing that skip the build (docs/CI changes) or a failed dispatch
  # condition leave the head SHA without a run. When a run is missing,
  # wait-nvidia-e2e times out and promote is *skipped* (not failed), so
  # this backfill must not depend on either job's conclusion — otherwise
  # the timeout path would skip it too and no evaluation could ever
  # self-heal. Run it after every non-workflow_run evaluation; each backfilled
  # run's completion re-triggers this workflow via workflow_run, and the
  # gates then find them and promote.
  dispatch-missing-e2e:
    name: Backfill e2e for testing head
    needs: [wait-nvidia-e2e]
    if: always() && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch Post-Testing E2E on testing head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          testing_head="$(gh api "repos/$REPO/branches/testing" --jq '.commit.sha')"

          # Dispatch non-NVIDIA E2E if no successful run exists for this head.
          existing="$(gh run list --repo "$REPO" --workflow post-testing-e2e.yml \
            --branch testing --status success \
            --json headSha --jq "[.[] | select(.headSha == \"$testing_head\")] | length")"
          if [[ "$existing" == "0" ]]; then
            gh workflow run post-testing-e2e.yml \
              --repo "$REPO" \
              --ref testing \
              -f image="ghcr.io/projectbluefin/bluefin-lts:testing" \
              -f suites="smoke"
            echo "Dispatched post-testing-e2e against testing ($testing_head)."
          else
            echo "Successful e2e run already recorded for $testing_head; skipping dispatch."
          fi

          # Dispatch NVIDIA E2E if no successful run exists for this head.
          nvidia_existing="$(gh run list --repo "$REPO" --workflow post-testing-e2e-nvidia.yml \
            --branch testing --status success \
            --json headSha --jq "[.[] | select(.headSha == \"$testing_head\")] | length")"
          if [[ "$nvidia_existing" == "0" ]]; then
            gh workflow run post-testing-e2e-nvidia.yml \
              --repo "$REPO" \
              --ref testing \
              -f image="ghcr.io/projectbluefin/bluefin-lts-nvidia:testing" \
              -f suites="smoke"
            echo "Dispatched post-testing-e2e-nvidia against testing ($testing_head)."
          else
            echo "Successful NVIDIA e2e run already recorded for $testing_head; skipping dispatch."
          fi

  mirror-validate-to-merge-group:
    name: Mirror validate status to merge-group SHA
    needs: [promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Post validate=success on merge queue head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROMOTION_BRANCH: auto/promote-testing-to-main
        run: |
          set -euo pipefail

          owner="${REPO%/*}"
          name="${REPO#*/}"

          pr_number="$(gh pr list --repo "$REPO" --state open --head "$PROMOTION_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "No open promotion PR on $PROMOTION_BRANCH; nothing to mirror."
            exit 0
          fi

          graphql_query="query(\$owner: String!, \$name: String!, \$number: Int!) { repository(owner: \$owner, name: \$name) { pullRequest(number: \$number) { mergeQueueEntry { headCommit { oid } } } } }"
          merge_group_sha=""

          for _ in {1..24}; do
            merge_group_sha="$(gh api graphql \
              -f query="$graphql_query" \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$pr_number" \
              --jq '.data.repository.pullRequest.mergeQueueEntry.headCommit.oid // ""')"
            [[ -n "$merge_group_sha" ]] && break
            sleep 5
          done

          if [[ -z "$merge_group_sha" ]]; then
            echo "PR #$pr_number is not in merge queue; skipping merge-group validate mirror."
            exit 0
          fi

          existing="$(gh api "repos/$REPO/commits/$merge_group_sha/status" \
            --jq '[.statuses[] | select(.context == "validate") | first | .state // ""]')"
          if [[ "$existing" == "success" ]]; then
            echo "validate already success on merge-group SHA $merge_group_sha"
            exit 0
          fi

          gh api "repos/$REPO/statuses/$merge_group_sha" \
            --method POST \
            --field state=success \
            --field context=validate \
            --field description='Validated by promotion workflow (merge-group head)' \
            --field target_url="$RUN_URL" >/dev/null
          echo "Posted validate=success on merge-group SHA $merge_group_sha"
