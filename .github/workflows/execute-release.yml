name: Execute Release

# Triggered by:
# - push to main whose commit message starts with
#   "chore: promote testing to main" (testing→main promotion squash commit)
# - daily schedule (04:00 UTC)
# - manual workflow_dispatch

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      is-promotion: ${{ steps.check.outputs.is-promotion }}
    steps:
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ] || echo "$COMMIT_MSG" | grep -q "^chore: promote testing to main"; then
            echo "is-promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-promotion=false" >> "$GITHUB_OUTPUT"
          fi

  execute:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.is-promotion == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      promoted_digests: ${{ steps.resolve.outputs.digests }}
      promoted_sha: ${{ steps.resolve-sha.outputs.sha }}
    env:
      REGISTRY: ghcr.io/projectbluefin
      VARIANTS_JSON: >-
        [
          {"image":"bluefin-lts","source_tag":"testing","target_tag":"stable"},
          {"image":"bluefin-lts-nvidia","source_tag":"testing","target_tag":"stable"}
        ]
      COSIGN_IDENTITY_REGEXP: ^https://github\.com/projectbluefin/(bluefin-lts|actions)/\.github/workflows/
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve fast-forward SHA
        id: resolve-sha
        shell: bash
        env:
          INPUT_SHA: ''
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry_host="${REGISTRY#docker://}"
          registry_host="${registry_host%%/*}"
          echo "$GH_TOKEN" | skopeo login "$registry_host" --username "${{ github.actor }}" --password-stdin

      - name: Resolve source digests
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          digests='{}'

          while IFS= read -r variant; do
            [ -n "$variant" ] || continue
            image=$(jq -r '.image' <<<"$variant")
            source_tag=$(jq -r '.source_tag' <<<"$variant")
            ref="${REGISTRY}/${image}:${source_tag}"
            digest=$(skopeo inspect --format '{{.Digest}}' "docker://${ref}")
            digests=$(jq -c --arg image "$image" --arg digest "$digest" '. + {($image): $digest}' <<<"$digests")
            echo "Resolved ${image}:${source_tag} -> ${digest}"
          done < <(jq -c '.[]' <<<"$VARIANTS_JSON")

          echo "digests=${digests}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Re-verify cosign signatures before promotion
        shell: bash
        env:
          DIGESTS_JSON: ${{ steps.resolve.outputs.digests }}
        run: |
          set -euo pipefail
          while IFS= read -r variant; do
            [ -n "$variant" ] || continue
            image=$(jq -r '.image' <<<"$variant")
            digest=$(jq -r --arg image "$image" '.[$image]' <<<"$DIGESTS_JSON")
            ref="${REGISTRY}/${image}@${digest}"
            echo "Verifying ${ref}"
            cosign verify \
              --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$ref" >/dev/null
          done < <(jq -c '.[]' <<<"$VARIANTS_JSON")

      - name: Promote digests to target tags
        shell: bash
        env:
          DIGESTS_JSON: ${{ steps.resolve.outputs.digests }}
        run: |
          set -uo pipefail
          failed_variants=()
          while IFS= read -r variant; do
            [ -n "$variant" ] || continue
            image=$(jq -r '.image' <<<"$variant")
            target_tag=$(jq -r '.target_tag' <<<"$variant")
            digest=$(jq -r --arg image "$image" '.[$image]' <<<"$DIGESTS_JSON")
            src="docker://${REGISTRY}/${image}@${digest}"
            dest="docker://${REGISTRY}/${image}:${target_tag}"
            echo "Promoting ${src} to ${dest}"
            if ! skopeo copy --preserve-digests --all "$src" "$dest"; then
              echo "::warning::Promotion failed for variant ${image} -> :${target_tag}"
              failed_variants+=("${image}:${target_tag}")
              continue
            fi

            promoted_digest=$(skopeo inspect --format '{{.Digest}}' "$dest")
            if [[ "$promoted_digest" != "$digest" ]]; then
              echo "::error::Promoted ${dest} resolved to ${promoted_digest}, expected ${digest}"
              failed_variants+=("${image}:${target_tag}:digest-mismatch")
              continue
            fi

            raw_manifest=$(skopeo inspect --raw "$dest")
            media_type=$(jq -r '.mediaType // empty' <<<"$raw_manifest")
            if [[ "$media_type" == "application/vnd.oci.image.index.v1+json" ||
              "$media_type" == "application/vnd.docker.distribution.manifest.list.v2+json" ]]; then
              if ! jq -e '([.manifests[]?.platform.architecture] | sort) == ["amd64", "arm64"]' \
                <<<"$raw_manifest" >/dev/null; then
                echo "::error::Promoted ${dest} image index is missing amd64 or arm64"
                failed_variants+=("${image}:${target_tag}:platform-mismatch")
              fi
            elif [[ "$(skopeo inspect --format '{{.Architecture}}' "$dest")" != "amd64" ]]; then
              echo "::error::Promoted ${dest} is neither an amd64 image nor a complete image index"
              failed_variants+=("${image}:${target_tag}:platform-mismatch")
            fi
          done < <(jq -c '.[]' <<<"$VARIANTS_JSON")

          if [ ${#failed_variants[@]} -gt 0 ]; then
            echo "::error::Promotion failed for ${#failed_variants[@]} variant(s): ${failed_variants[*]}"
            exit 1
          fi

      - name: Update sticky comment with promotion result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIGESTS_JSON: ${{ steps.resolve.outputs.digests }}
          PROMOTED_SHA: ${{ steps.resolve-sha.outputs.sha }}
        with:
          script: |
            const marker = '<!-- release-status-marker -->';
            const gateStart = '<!-- release-gate-start -->';
            const gateEnd = '<!-- release-gate-end -->';
            const reminderStart = '<!-- release-reminder-start -->';
            const reminderEnd = '<!-- release-reminder-end -->';
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info('No pull_request context (push trigger) — skipping sticky comment update.');
              return;
            }
            const digests = JSON.parse(process.env.DIGESTS_JSON || '{}');
            const variants = JSON.parse(process.env.VARIANTS_JSON || '[]');
            const actor = context.actor;
            const promotedAt = new Date().toISOString();

            const digestLines = variants.map((variant) => {
              const digest = digests[variant.image] || 'unknown';
              const shortDigest = digest.startsWith('sha256:')
                ? `sha256:${digest.slice(7, 23)}`
                : digest.slice(0, 16);
              return `| ${variant.image} | ${variant.source_tag} | ${variant.target_tag} | ${shortDigest} |`;
            }).join('\n');

            const gateSection = [
              gateStart,
              'Release status',
              '',
              'Status: promoted',
              `Promoted on (UTC): ${promotedAt}`,
              `Promoted by: ${actor}`,
              `Source SHA: ${process.env.PROMOTED_SHA}`,
              '',
              'Digests',
              '',
              '| Variant | Source tag | Target tag | Digest |',
              '|---|---|---|---|',
              digestLines || '| none | none | none | none |',
              gateEnd,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: [marker, gateSection].join('\n\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [marker, gateSection].join('\n\n'),
              });
            }

  release-notes:
    needs: [execute]
    if: always() && needs.execute.result == 'success'
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: read
    # Use bluefin-lts as the primary image so the stock LTS (CoreOS stable) kernel
    # version appears in the Key components table instead of the base CentOS kernel.
    uses: projectbluefin/actions/.github/workflows/reusable-release.yml@v1
    with:
      stream_name: stable
      image: ghcr.io/projectbluefin/bluefin-lts
      build_workflow: build-regular.yml
      build_branch: testing
      generate_sbom_inline: true
      checkout_ref: main
      project_name: Bluefin LTS
      badge_label: LTS
      accent_color: "#0ea5e9"
      cert_identity_regexp: >-
        ^https://github\.com/projectbluefin/(bluefin-lts|actions)/\.github/workflows/
      notable_packages: >-
        [
          {"sbom_name": "kernel", "label": "Kernel (LTS)"},
          {"sbom_name": "gnome-shell", "label": "GNOME Shell"},
          {"sbom_name": "flatpak", "label": "Flatpak"},
          {"sbom_name": "bootc", "label": "bootc"}
        ]
      docs_url: https://docs.projectbluefin.io/changelogs
    secrets: inherit

  post-release-variants:
    # Prepend a variants table to the release body so all promoted images are listed.
    needs: [execute, release-notes]
    if: always() && needs.release-notes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve promoted digests
        id: digests
        run: |
          set -euo pipefail
          for image in bluefin-lts bluefin-lts-nvidia; do
            digest=$(skopeo inspect --no-tags "docker://ghcr.io/projectbluefin/${image}:stable" \
              | jq -r '.Digest' | cut -c1-19)
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Prepend variants table to release
        env:
          LTS_DIGEST: ${{ steps.digests.outputs.bluefin-lts }}
          NVIDIA_DIGEST: ${{ steps.digests.outputs.bluefin-lts-nvidia }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          CURRENT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body')

          # Idempotency guard: skip if variants table already present (re-run protection)
          if echo "$CURRENT" | grep -q "## Variants promoted"; then
            echo "Variants table already present in release $TAG — skipping to avoid duplicate."
            exit 0
          fi

          VARIANTS_SECTION=$(printf '%s\n' \
            '## Variants promoted' \
            '' \
            '| Variant | Tag | Digest |' \
            '|---|---|---|' \
            "| \`bluefin-lts\` | \`:stable\` | \`${LTS_DIGEST}\` |" \
            "| \`bluefin-lts-nvidia\` | \`:stable\` | \`${NVIDIA_DIGEST}\` |" \
            '' \
            '> **bluefin-lts** and **bluefin-lts-nvidia** use the Fedora CoreOS stable kernel. The **Kernel (LTS)** version above applies to both.' \
            '' \
            '---' \
            '')
          printf '%s\n%s' "$VARIANTS_SECTION" "$CURRENT" > /tmp/updated-body.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file /tmp/updated-body.md
