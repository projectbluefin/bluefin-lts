name: Post-Testing E2E

# Runs e2e smoke tests after successful testing-image builds so
# promote-testing-to-main can gate on an existing verified run.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image reference to test
        required: false
        default: ghcr.io/projectbluefin/bluefin-lts:testing
        type: string
      suites:
        description: Comma-separated list of test suites to run
        required: false
        default: smoke
        type: string

permissions:
  contents: read
  packages: write

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify testing image is reachable
        env:
          IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'ghcr.io/projectbluefin/bluefin-lts:testing' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking image manifest for ${IMAGE_REF}"
          docker manifest inspect "${IMAGE_REF}" > /tmp/manifest.json
          jq -r '.schemaVersion // empty' /tmp/manifest.json
          echo "Verified image manifest for ${IMAGE_REF}"
