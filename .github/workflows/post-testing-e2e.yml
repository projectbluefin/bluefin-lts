name: Post-Testing E2E

# Runs e2e smoke tests after successful testing-image builds so
# promote-testing-to-main can gate on an existing verified run.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image reference to test
        required: false
        default: ghcr.io/projectbluefin/bluefin-lts:testing
        type: string
      suites:
        description: Comma-separated list of test suites to run
        required: false
        default: smoke
        type: string
  workflow_run:
    workflows: ["Build Bluefin LTS", "Build Bluefin Nvidia"]
    types: [completed]
    branches: [testing]

permissions:
  contents: read
  packages: write

concurrency:
  group: post-testing-e2e-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/run-testsuite.yml
    with:
      image: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'ghcr.io/projectbluefin/bluefin-lts:testing' }}
      suites: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || 'smoke' }}
    secrets: inherit
