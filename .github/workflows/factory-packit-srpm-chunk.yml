# One chunk of the Packit SRPM fan-out.
#
# This exists only because GitHub caps a matrix at 256 jobs and expands a
# larger one to nothing rather than failing it. The gate enumerates every
# recipe, so once the recipe set passed 256 its matrix would produce zero jobs
# and the run would fail beneath a green `discover` step above it -- exactly
# the failure the non-empty guard in the caller was written to prevent, and
# which that guard cannot see.
#
# The caller hands this workflow one chunk at a time. Per-package parallelism
# is unchanged.
name: Factory Packit SRPM chunk

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of package names to build SRPMs for.
        required: true
        type: string

permissions:
  contents: read

jobs:
  srpm:
    runs-on: ubuntu-24.04
    strategy:
      # One malformed spec must not cancel the rest of the chunk; the whole
      # point of the fan-out is to find every bad spec in one run.
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build and verify the SRPM
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p work/srpm
          python3 factory/tools/srpm_gate.py "$PACKAGE" \
            --output "work/srpm/$PACKAGE.src.rpm"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-srpm-${{ matrix.package }}
          path: work/srpm/${{ matrix.package }}.src.rpm
          if-no-files-found: error
          retention-days: 7
