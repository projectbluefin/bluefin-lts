name: Unit Tests

on:
  pull_request:
    # Base branch is enforced by pr-validation.yml's check-base-branch job,
    # which must trigger on main to reject mis-targeted PRs. These jobs run
    # only for PRs targeting testing, so a main-targeted PR shows that single
    # failing guard instead of green jobs that look like they passed.
    branches:
      - testing
    paths:
      - build_scripts/**
      - tests/**
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run bats unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats tests/unit/
