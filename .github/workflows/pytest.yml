name: Pytest

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/test_changelogs.py
      - .github/changelogs.py
      - .github/changelog_config.yaml
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

jobs:
  pytest:
    name: Run pytest for changelogs.py
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: pip install pytest pyyaml

      - name: Run pytest
        run: pytest tests/test_changelogs.py -v
