# Restore the libstoragemgmt daemon account that the libstoragemgmt RPM
# creates via its %pre `systemd-sysusers --replace` scriptlet. That user/group
# creation does not persist through the bootc/ostree image assembly, so the
# group referenced by /usr/lib/tmpfiles.d/libstoragemgmt.conf is absent at
# boot, tmpfiles cannot create /run/lsm/ipc, and libstoragemgmt.service (lsmd)
# fails to start. Defining it here lets first-boot systemd-sysusers create the
# account, matching upstream intent.
u libstoragemgmt - "daemon account for libstoragemgmt"
