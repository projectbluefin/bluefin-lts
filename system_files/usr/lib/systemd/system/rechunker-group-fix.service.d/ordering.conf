# The common service must repair legacy gshadow state before sysusers, but its
# local-fs.target ordering creates a cycle through systemd-tmpfiles-setup-dev.
# Run before local-fs-pre.target so the service is outside that early-boot
# cycle, while retaining the required sysusers ordering.
[Unit]
After=
Wants=
After=bootc-sysusers-shadow-sync.service
Before=systemd-sysusers.service local-fs-pre.target
