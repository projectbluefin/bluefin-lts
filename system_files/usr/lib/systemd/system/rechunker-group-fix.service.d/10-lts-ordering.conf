[Unit]
# The common unit's After=local-fs.target creates a cycle through
# systemd-tmpfiles-setup-dev.service and local-fs-pre.target. Reset that
# ordering here, while preserving the required sysusers ordering.
After=
After=bootc-sysusers-shadow-sync.service
Before=local-fs-pre.target systemd-sysusers.service
