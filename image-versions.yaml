images:
  - name: centos-bootc
    image: quay.io/centos-bootc/centos-bootc
    tag: c10s
    digest: sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de
  # The shared layer that owns ujust, the Homebrew preinstall lifecycle, the
  # setup hooks, udev rules, dconf/GSettings defaults, fastfetch and the
  # plymouth theme. Brought in-house from projectbluefin/common; the
  # `/system_files/bluefin` payload it publishes was renamed to
  # `/system_files/thallium` in the same change.
  #
  # Per-arch, not a single digest: thallium-suite/common publishes per-arch
  # tags (`<sha>-amd64`, `<sha>-arm64`) and a multi-arch `:latest`, and the
  # `:latest` manifest list is currently broken (empty digests). Pinning the
  # per-arch digests directly is correct anyway -- a multi-arch index digest
  # is not the digest of either image, so it cannot be used as a single
  # `COPY --from=` reference.
  #
  # Renovate tracks `tag` + `digest` here; the per-arch digests move
  # independently as each arch rebuilds, so both are kept current.
  - name: common
    image: ghcr.io/thallium-suite/common
    tag: latest
    x86_64:
      digest: sha256:f335aca1f9563b669966a3c464832b3ae65e80cfa3a558adf5f5d1e85e1d6700
    aarch64:
      digest: sha256:a26aee3cf6b97f8b991c87d5cd0b5fdf4b504ada57f439e2127e29076423a181
  - name: brew
    image: ghcr.io/ublue-os/brew
    tag: latest
    digest: sha256:5bdf54dc7c21c22db29df6550e3711788719c5123549ea6dc5645d5af47795e3
  # The GNOME stack, built by factory/ against this same CentOS Stream base
  # and published as an OCI repository image. Pinned by digest so a rebuild
  # cannot silently pick up different packages; Renovate keeps it current as
  # the :latest tag moves.
  #
  # amd64 only today. The factory is amd64 for v1 (see factory/README.md,
  # "Architectures"); arm64 recipes follow once the amd64 set is green. The
  # image build runs for x86_64 and aarch64, so the Justfile build recipe only
  # passes this reference on amd64 and arm64 falls back to the base image's
  # GNOME. The split is one line in the Justfile -- match the architecture
  # there to enable GNOME 51 on arm64 once the factory publishes it.
  - name: gnome_packages
    image: ghcr.io/thallium-suite/uranium-packages
    tag: latest
    digest: sha256:0e5efbacf20d811d5a696fd360bd96765206d742476838bf50dc15798958cb66

# Pinned binary downloads (managed by Renovate)
downloads:
